cilium:
  cni:
    chainingMode: aws-cni
    exclusive: false
  enableIPv4Masquerade: false
  routingMode: native
  kubeProxyReplacement: false
  operator:
    replicas: 2
    podLabels:
      olly.network-component: operator
    topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          olly.network-component: operator
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  hubble:
    enabled: true
    metrics:
      port: 9965
      enabled:
      - drop
      - tcp
      - icmp
      - flow:sourceContext=workload-name;destinationContext=workload-name
    relay:
      enabled: true
      replicas: 2
      podLabels:
        olly.network-component: relay
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            olly.network-component: relay
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
    ui:
      enabled: true
      replicas: 2
      podLabels:
        olly.network-component: ui
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            olly.network-component: ui
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
