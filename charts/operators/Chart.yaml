apiVersion: v2
name: observability-operators
version: 0.2.0
description: Pinned controllers installed before regional custom resources.
type: application
dependencies:
- name: cert-manager
  version: v1.21.2
  repository: https://charts.jetstack.io
  condition: components.cert-manager
- name: argo-rollouts
  version: 2.43.2
  repository: https://argoproj.github.io/argo-helm
  condition: components.argo-rollouts
- name: strimzi-kafka-operator
  version: 1.2.0
  repository: https://strimzi.io/charts
  condition: components.strimzi-kafka-operator
- name: opentelemetry-operator
  version: 0.123.0
  repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  condition: components.opentelemetry-operator
- name: altinity-clickhouse-operator
  version: 0.27.3
  repository: https://helm.altinity.com
  condition: components.altinity-clickhouse-operator
- name: cluster-autoscaler
  version: 9.59.0
  repository: https://kubernetes.github.io/autoscaler
  condition: components.cluster-autoscaler
- name: metrics-server
  version: 3.14.0
  repository: https://kubernetes-sigs.github.io/metrics-server
  condition: components.metrics-server
- name: keda
  version: 2.20.2
  repository: https://kedacore.github.io/charts
  condition: components.keda
