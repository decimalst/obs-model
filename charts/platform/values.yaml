region: us-east-1
clusterName: olly-us-east-1
storageClass: gp3-encrypted
createStorageClass: true
images:
  vector: timberio/vector:0.54.0-debian
  otel: otel/opentelemetry-collector-contrib:0.148.0
  quota: observability/log-quota:0.1.0
  clickhouse: clickhouse/clickhouse-server:25.8.33.6
  keeper: clickhouse/clickhouse-keeper:25.8.33.6
  curl: curlimages/curl:8.18.0
quota:
  replicas: 3
  redisAddress: quota.example.cache.amazonaws.com:6379
  redisTLS: true
  secretName: quota-redis
  eventsPerSecond: 1000
  eventBurst: 2000
  bytesPerSecond: 1048576
  byteBurst: 2097152
  debugEventsPerSecond: 100
  debugEventBurst: 200
  debugBytesPerSecond: 102400
  debugByteBurst: 204800
logs:
  agentEventsPerSecond: 500
  retentionDays: 7
  kafkaRetentionHours: 24
  kafkaStorage: 100Gi
  clickhouseStorage: 100Gi
  secretName: clickhouse-auth
  maxDebugHours: 24
  agentBufferBytes: 536870912
  gatewayBufferEvents: 2048
  writerBufferEvents: 4096
collectors:
  replicas: 3
  traceSamplingPercent: 10
  traceSpansPerSecond: 2000
  traceDecisionWaitSeconds: 30
  maxTraces: 50000
  scrapeInterval: 30s
  scrapeSampleLimit: 10000
  scrapeNamespaces:
  - observability
  interconnect: arrow
  arrowStreams: 1
  arrowQueueItems: 32768
  arrowMemoryMiB: 64
  arrowRequestMiB: 32
  arrowWaitingMiB: 8
  queueSize: 256
  queueConsumers: 4
  batchSize: 512
  batchMaxSize: 1024
  batchTimeout: 1s
  maxReceiveMiB: 4
  maxConcurrentStreams: 64
  traceExpectedPerSecond: 1000
  traceDecisionCache: 100000
  traceSlowMilliseconds: 1000
  traceErrorAllocation: 50
  traceSlowAllocation: 25
  traceBaselineAllocation: 25
  scrapeTimeout: 10s
  requireMetricIdentity: true
autoscaling:
  enabled: true
  maxReplicas: 12
  targetCPU: 70
writerAutoscaling:
  mode: kafka
  maxReplicas: 12
  lagThreshold: 5000
  pollingInterval: 15
  scaleDownStabilizationSeconds: 300
  scaleUpPodsPerMinute: 3
  scaleDownPodsPerMinute: 1
rollouts:
  enabled: true
  autoPromotionEnabled: false
  scaleDownDelaySeconds: 60
networkPolicy:
  enabled: true
  operatorNamespaces:
  - observability-system
  clientNamespaceLabel: observability/collect
  vpcCIDR: 10.40.0.0/16
flink:
  enabled: false
  image: ''
  jarURI: ''
  checkpointBucket: ''
  parallelism: 3
mimir:
  fullnameOverride: mimir
  minio:
    enabled: false
  kafka:
    enabled: false
  serviceAccount:
    create: true
    name: mimir
  global:
    podLabels:
      observability/backend: 'true'
  mimir:
    structuredConfig:
      multitenancy_enabled: true
      common:
        storage:
          backend: s3
          s3:
            endpoint: s3.us-east-1.amazonaws.com
            region: us-east-1
      blocks_storage:
        s3:
          bucket_name: REPLACE-mimir-blocks
      ruler_storage:
        s3:
          bucket_name: REPLACE-mimir-ruler
        backend: local
        local:
          directory: /etc/mimir/git-rules
      alertmanager_storage:
        s3:
          bucket_name: REPLACE-mimir-alertmanager
      ingest_storage:
        enabled: true
        kafka:
          address: telemetry-kafka-bootstrap:9092
          topic: mimir-ingest
          auto_create_topic_enabled: false
      limits:
        ingestion_rate: 50000
        ingestion_burst_size: 100000
        max_global_series_per_user: 1000000
        compactor_blocks_retention_period: 15d
        max_query_parallelism: 16
        max_global_series_per_metric: 50000
        max_label_names_per_series: 40
        max_label_name_length: 128
        max_label_value_length: 512
        max_fetched_series_per_query: 100000
        max_fetched_chunk_bytes_per_query: 536870912
        out_of_order_time_window: 2m
        max_query_lookback: 15d
        metric_relabel_configs:
        - action: drop
          source_labels:
          - user_id
          - user_email
          - enduser_id
          - request_id
          - session_id
          - trace_id
          - span_id
          - http_url
          - http_target
          - url_full
          - url_path
          - url_query
          - db_statement
          - db_query_text
          - exception_message
          - exception_stacktrace
          - container_id
          - pod_template_hash
          separator: ''
          regex: .+
      ruler:
        enable_api: false
        poll_interval: 1m
  ingester:
    replicas: 3
    zoneAwareReplication:
      enabled: true
      zones: &id001
      - name: a
        nodeSelector:
          topology.kubernetes.io/zone: us-east-1a
      - name: b
        nodeSelector:
          topology.kubernetes.io/zone: us-east-1b
      - name: c
        nodeSelector:
          topology.kubernetes.io/zone: us-east-1c
    persistentVolume:
      size: 20Gi
      storageClass: gp3-encrypted
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        memory: 4Gi
  store_gateway:
    replicas: 3
    zoneAwareReplication:
      enabled: true
      zones: *id001
    persistentVolume:
      size: 20Gi
      storageClass: gp3-encrypted
  alertmanager:
    replicas: 3
    zoneAwareReplication:
      enabled: true
      zones: *id001
    persistentVolume:
      size: 2Gi
      storageClass: gp3-encrypted
  compactor:
    replicas: 2
    persistentVolume:
      size: 20Gi
      storageClass: gp3-encrypted
  distributor:
    replicas: 3
  querier:
    replicas: 3
  query_frontend:
    replicas: 2
  query_scheduler:
    replicas: 2
  ruler:
    replicas: 2
    extraVolumes:
    - name: git-rules
      configMap:
        name: olly-rules
        items:
        - key: platform.yaml
          path: platform/platform.yaml
    extraVolumeMounts:
    - name: git-rules
      mountPath: /etc/mimir/git-rules
      readOnly: true
  gateway:
    replicas: 2
  nginx:
    enabled: false
  rollout_operator:
    enabled: true
tempo:
  fullnameOverride: tempo
  serviceAccount:
    create: true
    name: tempo
  ingester:
    replicas: 3
    zoneAwareReplication:
      enabled: true
      zones: *id001
    persistence:
      enabled: true
      size: 20Gi
      storageClass: gp3-encrypted
    config:
      replication_factor: 3
  distributor:
    replicas: 3
  querier:
    replicas: 2
  queryFrontend:
    replicas: 2
  compactor:
    replicas: 2
    config:
      compaction:
        block_retention: 72h
  traces:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
  storage:
    trace:
      backend: s3
      s3:
        bucket: REPLACE-tempo
        endpoint: s3.us-east-1.amazonaws.com
        region: us-east-1
        insecure: false
  overrides:
    defaults:
      ingestion:
        rate_strategy: global
        rate_limit_bytes: 5000000
        burst_size_bytes: 10000000
      global:
        max_bytes_per_trace: 5000000
grafana:
  fullnameOverride: grafana
  replicas: 2
  podLabels:
    observability/backend: 'true'
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: grafana-db
  grafana.ini:
    database:
      type: postgres
      host: $__env{GF_DATABASE_HOST}
      name: grafana
      user: grafana
      password: $__env{GF_DATABASE_PASSWORD}
      ssl_mode: require
    auth.anonymous:
      enabled: false
    security:
      cookie_secure: true
    unified_alerting:
      enabled: false
  plugins:
  - grafana-clickhouse-datasource 4.11.2
  envValueFrom:
    CLICKHOUSE_PASSWORD:
      secretKeyRef:
        name: clickhouse-auth
        key: password
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
      - name: Regional metrics
        uid: mimir
        type: prometheus
        url: http://mimir-gateway/prometheus
        access: proxy
        isDefault: true
        jsonData:
          httpHeaderName1: X-Scope-OrgID
        secureJsonData:
          httpHeaderValue1: platform
      - name: Regional traces
        uid: tempo
        type: tempo
        url: http://tempo-query-frontend:3200
        access: proxy
        jsonData:
          tracesToLogsV2:
            datasourceUid: clickhouse
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
      - name: Regional logs
        uid: clickhouse
        type: grafana-clickhouse-datasource
        jsonData:
          host: clickhouse-observability
          port: 8123
          protocol: http
          username: reader
          defaultDatabase: observability
        secureJsonData:
          password: $CLICKHOUSE_PASSWORD
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
        topologyKey: topology.kubernetes.io/zone
  podDisruptionBudget:
    minAvailable: 1
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: default
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/default
        allowUiUpdates: false
        updateIntervalSeconds: 10
  dashboardsConfigMaps:
    default: olly-dashboards
scaling:
  writerReplicas: 3
  scrapeReplicas: 3
  extraKafkaBrokers: 0
  logPartitions: 36
  metricsPartitions: 1
resources:
  agents:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  gateways:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  samplers:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 2Gi
  writers:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  quota:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: '2'
      memory: 1Gi
  scrape:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  targetAllocator:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  kafka:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  clickhouse:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 4Gi
  keeper:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 1Gi
clickhouse:
  shards: 2
  replicas: 3
  insertQuorum: 2
  insertQuorumTimeoutMs: 10000
  schemaJob: true
  pauseWrites: false
