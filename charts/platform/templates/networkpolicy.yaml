{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: regional-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    # The observability namespace is a trusted administrative boundary.
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability-system}
    - from:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
  egress:
    # EKS Pod Identity credentials use this node-local HTTP endpoint.
    - to:
        - ipBlock: {cidr: 169.254.170.23/32}
      ports:
        - {protocol: TCP, port: 80}
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCIDR }}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
        - {protocol: TCP, port: 10250}
    - to:
        - namespaceSelector:
            matchLabels:
              {{ .Values.networkPolicy.clientNamespaceLabel }}: "true"
---
# The API server calls Mimir's rollout admission webhook from VPC addresses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mimir-rollout-webhook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rollout-operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCIDR }}
      ports:
        - {protocol: TCP, port: 8443}
{{- end }}
