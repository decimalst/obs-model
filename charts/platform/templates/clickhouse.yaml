apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-config
data:
  keeper.xml: |
    <clickhouse>
      <logger><level>warning</level><console>1</console></logger>
      <listen_host>0.0.0.0</listen_host>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id from_env="KEEPER_ID"/>
        <log_storage_path>/var/lib/clickhouse-keeper/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse-keeper/snapshots</snapshot_storage_path>
        <coordination_settings><operation_timeout_ms>10000</operation_timeout_ms><session_timeout_ms>30000</session_timeout_ms><raft_logs_level>warning</raft_logs_level></coordination_settings>
        <raft_configuration>
        {{- range $i := until 3 }}
          <server><id>{{ $i }}</id><hostname>keeper-{{ $i }}.keeper-peer</hostname><port>9234</port></server>
        {{- end }}
        </raft_configuration>
      </keeper_server>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keeper
spec:
  serviceName: keeper-peer
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app: keeper}
  template:
    metadata:
      labels: {app: keeper}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      {{- include "olly.spread" "keeper" | nindent 6 }}
      containers:
        - name: keeper
          image: {{ .Values.images.keeper }}
          command: ["/bin/bash", "-ec"]
          args:
            - 'export KEEPER_ID="${HOSTNAME##*-}"; exec clickhouse-keeper --config-file=/conf/keeper.xml'
          ports:
            - {name: client, containerPort: 9181}
            - {name: raft, containerPort: 9234}
          readinessProbe:
            tcpSocket: {port: client}
          livenessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.resources.keeper | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /conf, readOnly: true}
            - {name: data, mountPath: /var/lib/clickhouse-keeper}
      volumes:
        - name: config
          configMap: {name: keeper-config}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: keeper-peer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: keeper}
  ports:
    - {name: client, port: 9181}
    - {name: raft, port: 9234}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: keeper
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: keeper}
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: observability
spec:
  defaults:
    templates:
      podTemplate: data
      dataVolumeClaimTemplate: data
  configuration:
    settings:
      prometheus/endpoint: /metrics
      prometheus/port: 9363
      prometheus/metrics: true
      prometheus/events: true
      prometheus/asynchronous_metrics: true
    zookeeper:
      nodes:
        {{- range $i := until 3 }}
        - host: keeper-{{ $i }}.keeper-peer
          port: 9181
        {{- end }}
    clusters:
      - name: logs
        secret:
          valueFrom:
            secretKeyRef:
              name: {{ .Values.logs.secretName }}
              key: password
        schemaPolicy:
          replica: All
          shard: All
        layout:
          replicasCount: {{ .Values.clickhouse.replicas }}
          shards:
            {{- range $i := until (int .Values.clickhouse.shards) }}
            - name: {{ $i | quote }}
              internalReplication: Enabled
              replicasCount: {{ $.Values.clickhouse.replicas }}
            {{- end }}
    profiles:
      {{- if .Values.support.canary.enabled }}
      canary/readonly: 1
      canary/skip_unavailable_shards: 0
      canary/max_execution_time: 3
      canary/max_rows_to_read: 100000
      canary/max_bytes_to_read: 16777216
      canary/max_memory_usage: 67108864
      canary/max_result_rows: 1
      canary/max_threads: 1
      {{- end }}
      default/log_queries: 1
      default/max_memory_usage: 2000000000
      default/distributed_foreground_insert: 1
      default/async_insert: 0
      default/skip_unavailable_shards: 0
      default/insert_quorum: {{ .Values.clickhouse.insertQuorum }}
      default/insert_quorum_timeout: {{ .Values.clickhouse.insertQuorumTimeoutMs }}
      default/insert_quorum_parallel: 1
      readonly/readonly: 1
      readonly/skip_unavailable_shards: 0
      readonly/max_memory_usage: 2000000000
    users:
      {{- if .Values.support.canary.enabled }}
      canary/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.support.canary.secretName }}
            key: password
      canary/networks/ip: "{{ .Values.networkPolicy.vpcCIDR }}"
      canary/profile: canary
      {{- end }}
      default/networks/ip: "127.0.0.1"
      writer/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.logs.secretName }}
            key: password
      writer/networks/ip: "{{ .Values.networkPolicy.vpcCIDR }}"
      writer/profile: default
      reader/password:
        valueFrom:
          secretKeyRef:
            name: {{ .Values.logs.secretName }}
            key: password
      reader/networks/ip: "{{ .Values.networkPolicy.vpcCIDR }}"
      reader/profile: readonly
  templates:
    podTemplates:
      - name: data
        # Spread copies of EACH shard across AZs; global anti-affinity would
        # make the fourth pod unschedulable in a three-AZ region.
        podDistribution:
          - type: ShardAntiAffinity
            topologyKey: topology.kubernetes.io/zone
        spec:
          automountServiceAccountToken: false
          containers:
            - name: clickhouse
              image: {{ .Values.images.clickhouse }}
              ports:
                - {name: metrics, containerPort: 9363}
              resources:
                {{- toYaml .Values.resources.clickhouse | nindent 16 }}
    volumeClaimTemplates:
      - name: data
        reclaimPolicy: Retain
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: {{ .Values.storageClass }}
          resources:
            requests:
              storage: {{ .Values.logs.clickhouseStorage }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      clickhouse.altinity.com/chi: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-schema
data:
  schema.sql: |
    -- Fail closed instead of silently keeping the pre-0.3 single-shard schema.
    SELECT throwIf(count() > 0, 'Legacy log schema: follow docs/clickhouse-sharding.md before upgrading')
    FROM clusterAllReplicas('logs', system.tables)
    WHERE database = 'observability'
      AND ((name = 'logs' AND engine != 'Distributed')
        OR (name = 'log_events' AND engine != 'View'));
    CREATE DATABASE IF NOT EXISTS observability ON CLUSTER logs;
    CREATE TABLE IF NOT EXISTS observability.logs_local ON CLUSTER logs
    (
      cluster_name LowCardinality(String),
      event_id UUID,
      timestamp DateTime64(3, 'UTC'),
      service_key LowCardinality(String),
      service_name LowCardinality(String),
      namespace LowCardinality(String),
      level LowCardinality(String),
      message String CODEC(ZSTD(3)),
      trace_id String
    )
    ENGINE = ReplicatedMergeTree('/clickhouse/tables/{{ .Release.Namespace }}/observability/{shard}/logs_local', '{replica}')
    PARTITION BY toDate(timestamp)
    ORDER BY (cluster_name, namespace, service_name, timestamp, event_id)
    TTL timestamp + INTERVAL {{ .Values.logs.retentionDays }} DAY DELETE;
    CREATE TABLE IF NOT EXISTS observability.log_events_local ON CLUSTER logs
    (
      cluster_name LowCardinality(String),
      minute DateTime('UTC'),
      service_key LowCardinality(String),
      level LowCardinality(String),
      count UInt64
    )
    ENGINE = ReplicatedSummingMergeTree('/clickhouse/tables/{{ .Release.Namespace }}/observability/{shard}/log_events_local', '{replica}')
    PARTITION BY toDate(minute)
    ORDER BY (cluster_name, service_key, level, minute)
    TTL minute + INTERVAL {{ .Values.logs.retentionDays }} DAY DELETE;
    CREATE MATERIALIZED VIEW IF NOT EXISTS observability.log_events_mv ON CLUSTER logs
    TO observability.log_events_local AS
    SELECT cluster_name, toStartOfMinute(timestamp) AS minute, service_key, level, count() AS count
    FROM observability.logs_local GROUP BY cluster_name, minute, service_key, level;
    CREATE TABLE IF NOT EXISTS observability.logs ON CLUSTER logs
    AS observability.logs_local
    ENGINE = Distributed('logs', 'observability', 'logs_local', cityHash64(cluster_name, service_key, event_id));
    CREATE TABLE IF NOT EXISTS observability.log_events_shards ON CLUSTER logs
    AS observability.log_events_local
    ENGINE = Distributed('logs', 'observability', 'log_events_local');
    CREATE VIEW IF NOT EXISTS observability.log_events ON CLUSTER logs AS
    SELECT cluster_name, minute, service_key, level, sum(count) AS count
    FROM observability.log_events_shards GROUP BY cluster_name, minute, service_key, level;
