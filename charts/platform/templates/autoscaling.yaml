{{- if .Values.autoscaling.enabled }}
{{- range $name := list "log-quota" "vector-gateway" "otel-router" "otel-metrics" "vector-writer" }}
{{- if or (ne $name "vector-writer") (and (not $.Values.clickhouse.pauseWrites) (eq $.Values.writerAutoscaling.mode "cpu")) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: {{ if and $.Values.rollouts.enabled (ne $name "vector-writer") }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ if and $.Values.rollouts.enabled (ne $name "vector-writer") }}Rollout{{ else }}Deployment{{ end }}
    name: {{ $name }}
  minReplicas: {{ if eq $name "vector-writer" }}{{ $.Values.scaling.writerReplicas }}{{ else }}3{{ end }}
  maxReplicas: {{ if eq $name "vector-writer" }}{{ min $.Values.writerAutoscaling.maxReplicas $.Values.scaling.logPartitions }}{{ else }}{{ $.Values.autoscaling.maxReplicas }}{{ end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.autoscaling.targetCPU }}
{{- end }}
{{- end }}
{{- end }}
