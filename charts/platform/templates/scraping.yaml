apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-scrape
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-otel-scrape
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-otel-scrape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-otel-scrape
subjects:
  - kind: ServiceAccount
    name: otel-scrape
    namespace: {{ .Release.Namespace }}
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-scrape
spec:
  mode: statefulset
  replicas: {{ .Values.scaling.scrapeReplicas }}
  image: {{ .Values.images.otel }}
  serviceAccount: otel-scrape
  targetAllocator:
    enabled: true
    replicas: 2
    podDisruptionBudget:
      minAvailable: 1
    resources:
      {{- toYaml .Values.resources.targetAllocator | nindent 6 }}
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: topology.kubernetes.io/zone
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: otel-scrape-targetallocator
    serviceAccount: otel-scrape
    allocationStrategy: consistent-hashing
    prometheusCR:
      enabled: false
  resources:
    {{- toYaml .Values.resources.scrape | nindent 4 }}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: otel-scrape-collector
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: annotated-pods
              scrape_interval: {{ .Values.collectors.scrapeInterval }}
              scrape_timeout: {{ .Values.collectors.scrapeTimeout }}
              sample_limit: {{ .Values.collectors.scrapeSampleLimit }}
              label_limit: {{ .Values.mimir.mimir.structuredConfig.limits.max_label_names_per_series }}
              label_name_length_limit: {{ .Values.mimir.mimir.structuredConfig.limits.max_label_name_length }}
              label_value_length_limit: {{ .Values.mimir.mimir.structuredConfig.limits.max_label_value_length }}
              kubernetes_sd_configs:
                - role: pod
                  namespaces:
                    names: {{ .Values.collectors.scrapeNamespaces | toJson }}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_phase]
                  action: keep
                  regex: Running
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
                  target_label: __tmp_metrics_port
                - source_labels: [__meta_kubernetes_pod_container_port_number]
                  action: keepequal
                  target_label: __tmp_metrics_port
                - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  action: replace
                  regex: '([^:]+)(?::\d+)?;(\d+)'
                  replacement: '$$1:$$2'
                  target_label: __address__
                - source_labels: [__meta_kubernetes_namespace]
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: olly_component
              metric_relabel_configs:
                {{- toYaml .Values.mimir.mimir.structuredConfig.limits.metric_relabel_configs | nindent 16 }}
            {{- range $job := list (dict "name" "mimir" "label" "__meta_kubernetes_pod_label_app_kubernetes_io_name" "match" "mimir" "port" "8080" "metrics" "(cortex_.*|alertmanager_.*|process_.*)") (dict "name" "tempo" "label" "__meta_kubernetes_pod_label_app_kubernetes_io_name" "match" "tempo" "port" "3200" "metrics" "(tempo_.*|process_.*)") (dict "name" "clickhouse" "label" "__meta_kubernetes_pod_label_clickhouse_altinity_com_chi" "match" "observability" "port" "9363" "metrics" "ClickHouse.*") (dict "name" "kafka-exporter" "label" "__meta_kubernetes_pod_label_strimzi_io_kind" "match" "KafkaExporter" "port" "9404" "metrics" "kafka_.*") }}
            - job_name: {{ $job.name }}
              scrape_interval: {{ $.Values.collectors.scrapeInterval }}
              scrape_timeout: {{ $.Values.collectors.scrapeTimeout }}
              sample_limit: {{ $.Values.collectors.scrapeSampleLimit }}
              label_limit: {{ $.Values.mimir.mimir.structuredConfig.limits.max_label_names_per_series }}
              label_value_length_limit: {{ $.Values.mimir.mimir.structuredConfig.limits.max_label_value_length }}
              kubernetes_sd_configs:
                - role: pod
                  namespaces: {names: [{{ $.Release.Namespace }}]}
              relabel_configs:
                - {source_labels: [{{ $job.label }}], regex: {{ $job.match | quote }}, action: keep}
                - {source_labels: [__meta_kubernetes_pod_container_port_number], regex: {{ $job.port | quote }}, action: keep}
                - {source_labels: [__meta_kubernetes_pod_phase], regex: Running, action: keep}
                - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component], target_label: component}
              metric_relabel_configs:
                - {source_labels: [__name__], regex: {{ $job.metrics | quote }}, action: keep}
                {{- toYaml $.Values.mimir.mimir.structuredConfig.limits.metric_relabel_configs | nindent 16 }}
            {{- end }}
            {{- if .Values.hubble.enabled }}
            - job_name: hubble
              scrape_interval: {{ .Values.collectors.scrapeInterval }}
              scrape_timeout: {{ .Values.collectors.scrapeTimeout }}
              sample_limit: {{ .Values.hubble.sampleLimit }}
              label_limit: {{ .Values.mimir.mimir.structuredConfig.limits.max_label_names_per_series }}
              label_value_length_limit: {{ .Values.mimir.mimir.structuredConfig.limits.max_label_value_length }}
              kubernetes_sd_configs:
                - role: node
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_address_InternalIP]
                  regex: '(.+)'
                  replacement: '$$1:9965'
                  target_label: __address__
              metric_relabel_configs:
                - source_labels: [__name__]
                  regex: 'hubble_(drop_total|tcp_flags_total|icmp_total|flows_processed_total)'
                  action: keep
                {{- toYaml .Values.mimir.mimir.structuredConfig.limits.metric_relabel_configs | nindent 16 }}
            {{- end }}
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
      batch:
        {{- include "olly.batch" . | nindent 8 }}
    exporters:
      {{ include "olly.interconnect" . }}:
        endpoint: otel-metrics:4317
        tls: {insecure: true}
        {{- include "olly.interconnectQueue" . | nindent 8 }}
        {{- include "olly.arrowExport" . | nindent 8 }}
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [{{ include "olly.interconnect" . }}]
