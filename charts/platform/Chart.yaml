apiVersion: v2
name: observability-platform
version: 0.7.0
description: Region-local logs, metrics, traces, and Grafana with bounded debug grants.
type: application
appVersion: "0.7.0"
dependencies:
  - name: mimir-distributed
    alias: mimir
    version: 6.2.0
    repository: https://grafana.github.io/helm-charts
  - name: tempo-distributed
    alias: tempo
    version: 1.61.3
    repository: https://grafana.github.io/helm-charts
  - name: grafana
    version: 10.5.15
    repository: https://grafana.github.io/helm-charts
  - name: pyroscope
    version: 2.3.1
    repository: https://grafana.github.io/helm-charts
    condition: profiling.enabled
