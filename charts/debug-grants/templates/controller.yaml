apiVersion: v1
kind: ServiceAccount
metadata:
  name: debug-grants
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-grants
rules:
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-grants
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: debug-grants}
subjects:
  - kind: ServiceAccount
    name: debug-grants
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-grants
data:
  debug_grants.py: |
{{ .Files.Get "debug_grants.py" | indent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: debug-grants
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 50
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: debug-grants
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: reconcile
              image: {{ .Values.image }}
              command: [python, /app/debug_grants.py, reconcile, --in-cluster, --namespace, {{ .Release.Namespace | quote }}]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 250m, memory: 128Mi}
              volumeMounts:
                - {name: script, mountPath: /app, readOnly: true}
          volumes:
            - name: script
              configMap: {name: debug-grants}
