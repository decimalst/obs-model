name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.8'
          cache-dependency-path: services/log-quota/go.sum
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
        with:
          version: v1.35.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.19.0'}
      - run: make setup deps
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - run: make check GO=go KUBECONFORM=kubeconform
      - name: Check stateful topology changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .venv/bin/python scripts/check_shard_changes.py --base-ref "$BASE_SHA"
      - run: make terraform-init terraform-test studio-terraform-test
      - run: make runtime-test GO=go
      - run: make image integration-test collector-test rules-test sharding-test consumer-test red-test dashboard-test profiling-test support-test
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -shellcheck=
